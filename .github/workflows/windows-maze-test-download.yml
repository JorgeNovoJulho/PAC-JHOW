name: Publish Windows maze test download (public prerelease)
on:
  push:
    branches:
      - feat/android-capacitor-1.1.0
    paths:
      - .github/workflows/windows-maze-test-download.yml
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve verified Windows test installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p installer
          gh run download 41570683304 --repo "$GITHUB_REPOSITORY" --name PAC-JHOW-Windows-validation --dir installer
          test -s installer/PAC-JHOW-Setup-1.0.6.exe
          sha256sum installer/PAC-JHOW-Setup-1.0.6.exe | tee installer/SHA256SUMS.txt
      - name: Publish public test release without replacing official installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.6-maze2to10-test"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Test release already exists; not overwriting."
            exit 0
          fi
          gh release create "$TAG" installer/PAC-JHOW-Setup-1.0.6.exe installer/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --prerelease --target 828504ac8fff81faa58dc56696f9c865d4cba315 \
            --title "PAC-JHOW Windows — teste labirintos 2 a 10" \
            --notes "Distribuição pública do build de teste aprovado em GitHub Actions #41570683304. Níveis 2 a 10 com layouts fixos e rotas abertas; níveis 1 e 11–20 não alterados. Versão de TESTE, não substitui a oficial. Instalação sobre 1.0.6 pode afetar o perfil local: recomenda-se backup."
