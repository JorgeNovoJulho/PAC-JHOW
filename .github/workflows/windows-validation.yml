name: Windows build validation (no publish)
on:
  push:
    branches:
      - feat/android-capacitor-1.1.0
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Compile Windows installer locally
        shell: pwsh
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Upload Windows validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: PAC-JHOW-Windows-validation
          path: dist/*.exe
          if-no-files-found: error
