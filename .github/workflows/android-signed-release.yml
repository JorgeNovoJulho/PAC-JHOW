name: Android signed release (manual approval)
on:
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer sem v (ex.: 1.2.0)"
        required: true
        type: string
      channel:
        description: "Canal"
        required: true
        type: choice
        options:
          - beta
          - stable
permissions:
  contents: write
jobs:
  signed-android:
    environment: android-production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate version and signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid SemVer"; exit 1; }
          test -n "$KEYSTORE_B64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || { echo "Missing Android signing secrets"; exit 1; }
      - name: Install Capacitor and browser tooling
        run: |
          npm install --no-save --no-package-lock @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/browser@7 playwright
          npx playwright install chromium --with-deps
      - name: Validate shared UI
        run: node scripts/ui-smoke.mjs
      - name: Stage web game and set version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p web/icons
          cp index.html style.css game.js audio.js maze.js settings.js leaderboard.js mobile-controls.js android-updater.js android-record.js web/
          cp Pac-Jhow.mp3 Pac-Jhow-2.mp3 pacman.ico web/
          cp -R icons/. web/icons/
          python3 - <<'PY'
          import os,pathlib
          p=pathlib.Path("web/android-updater.js")
          s=p.read_text()
          import re
          s,n=re.subn(r'const CURRENT="[^"]+";', 'const CURRENT="'+os.environ["VERSION"]+'";',s,count=1)
          if n!=1: raise SystemExit("Android update version not found")
          p.write_text(s)
          PY
      - name: Generate native Android project
        run: |
          npx cap add android
          npx cap sync android
          python -m pip install --quiet Pillow
          python scripts/apply-android-icon.py
      - name: Configure signed production build
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION: ${{ inputs.version }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 -d > android/app/pacjhow-release.jks
          python3 - <<'PY'
          import os,pathlib
          p=pathlib.Path("android/app/build.gradle")
          s=p.read_text()
          major,minor,patch=map(int,os.environ["VERSION"].split("."))
          code=major*1000000+minor*1000+patch
          if code<=0 or code>2100000000: raise SystemExit("versionCode out of range")
          import re
          s,n=re.subn(r'versionCode\s+\d+', 'versionCode '+str(code),s,count=1)
          if n!=1: raise SystemExit("versionCode not found")
          s,n=re.subn(r'versionName\s+"[^"]+"', 'versionName "'+os.environ["VERSION"]+'"',s,count=1)
          if n!=1: raise SystemExit("versionName not found")
          s=s.replace('android {','''android {
              signingConfigs {
                  pacJhowRelease {
                      storeFile file('pacjhow-release.jks')
                      storePassword System.getenv('ANDROID_STORE_PASSWORD')
                      keyAlias System.getenv('ANDROID_KEY_ALIAS')
                      keyPassword System.getenv('ANDROID_KEY_PASSWORD')
                  }
              }
          ''',1)
          s=s.replace('buildTypes {','''buildTypes {
              release {
                  signingConfig signingConfigs.pacJhowRelease
              }
          ''',1)
          p.write_text(s)
          PY
          test -s android/app/pacjhow-release.jks
      - name: Build signed APK
        working-directory: android
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash ./gradlew assembleRelease --no-daemon
      - name: Verify signed APK
        env:
          VERSION: ${{ inputs.version }}
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          mkdir -p publication
          cp "$APK" "publication/PAC-JHOW-Android-${VERSION}.apk"
          sha256sum "publication/PAC-JHOW-Android-${VERSION}.apk" > publication/SHA256SUMS.txt
      - name: Publish approved release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          TAG="v${VERSION}-android"
          if gh release view "$TAG" >/dev/null 2>&1; then echo "Tag already exists, refusing overwrite"; exit 1; fi
          args=()
          if [ "$CHANNEL" = beta ]; then args+=(--prerelease); fi
          gh release create "$TAG" publication/* --target "$GITHUB_SHA" --title "PAC-JHOW Android ${VERSION}" --notes "Android APK assinado. Confira o SHA256SUMS.txt e as instrucoes antes de instalar. Instalacao requer aprovacao do usuario." "${args[@]}"
